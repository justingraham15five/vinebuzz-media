<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>VineBUZZ</title>
<link rel="stylesheet" href="../../assets/vinebuzz.css">
<style>
header.top .clogo{height:32px;width:auto;max-width:140px;object-fit:contain}
.help{display:flex;flex-direction:column;gap:6px;align-items:center;margin-bottom:12px;font-size:13px;color:#ddd}
.help a{color:#fff}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.reply{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<header class="top">
  <img class="v" src="../../brand/vinedentity/vinedentity-v-icon.png" alt="Vinedentity">
  <div><h1 id="bizname">VineBUZZ</h1><div class="sub">Your upcoming posts</div></div>
  <div class="grow"></div>
  <img class="clogo" id="clogo" alt="" hidden>
</header>
<main>
  <div id="pills" class="row" style="margin-bottom:10px"></div>
  <div id="banner"></div>
  <div id="notices"></div>
  <div class="tabs" id="tabs"></div>
  <div id="ctrl"></div>
  <div id="view"><div class="empty">Loading your posts…</div></div>
  <p class="small muted" style="text-align:center;margin-top:18px">Or just reply to our text with <b>APPROVE</b> and the ad number, for example APPROVE <span id="exid">ABC-0001</span>.</p>
</main>
<footer class="foot">
  <div class="help" id="help"></div>
  Powered by Vinedentity
  <img src="../../brand/vinedentity/vinedentity-full-logo-transparent.png" alt="Vinedentity technology &amp; marketing solutions">
</footer>
<script>
(async () => {
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const PNAME = {facebook:"Facebook",instagram:"Instagram",linkedin:"LinkedIn",tiktok:"TikTok",x:"X",google_business:"Google Business",youtube:"YouTube",pinterest:"Pinterest"};
const RANGES = [["today","Today",0],["7","7 days",7],["30","30 days",30],["90","90 days",90],["365","1 year",365]];
const PREV = [["7","7 days",7],["30","30 days",30],["90","90 days",90],["365","1 year",365]];
let D, tab = "all", range = "7", prange = "30", psort = "top";
const dt = s => new Date(s).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

try { const r = await fetch("data.json", { cache: "no-store" }); D = await r.json(); }
catch { $("view").innerHTML = '<div class="empty">This page is updating. Please check back in a few minutes.</div>'; return; }

document.title = `${D.business_name} VineBUZZ`;
$("bizname").textContent = `${D.business_name} VineBUZZ`;
if (D.logo) { $("clogo").src = D.logo; $("clogo").hidden = false; }
$("exid").textContent = (D.client_code || "ABC") + "-0001";

const ads = D.ads || [];
const form = (ad, action) => D.approval_form_url ? `${D.approval_form_url}${D.approval_form_url.includes("?") ? "&" : "?"}ad_id=${encodeURIComponent(ad.ad_id)}&client=${encodeURIComponent(D.client_code)}&action=${action}` : null;
function actBtns(a) {
  const ap = form(a, "approve"), ch = form(a, "change");
  return `<div class="acts">${ap ? `<a class="btn primary" href="${esc(ap)}" target="_blank" rel="noopener">Approve</a>` : ""}${ch ? `<a class="btn" href="${esc(ch)}" target="_blank" rel="noopener">Request changes</a>` : ""}</div>`;
}
const thumb = a => `<div class="thumb">${a.image ? `<img src="${esc(a.image)}" alt="${esc(a.alt || a.title)}">` : esc(a.type || "Post")}</div>`;
const plats = a => (a.platforms || []).map(p => PNAME[p] || p).join(" · ");
function card(a, cls = "", label = "", extra = "") {
  return `<div class="ad ${cls}">${thumb(a)}<div class="body">${label}<div class="title">${esc(a.title)} <span class="muted small">${esc(a.ad_id)}</span></div>
    <div class="meta">${a.go_out ? (new Date(a.go_out) < Date.now() ? "Went out " : "Goes out ") + esc(dt(a.go_out)) : ""}${a.platforms?.length ? " · " + esc(plats(a)) : ""}</div>
    ${a.copy ? `<div class="small" style="margin-top:6px;white-space:pre-wrap">${esc(a.copy)}</div>` : ""}
    ${a.issue ? `<div class="banner ${a.issue.level || "red"}" style="margin:8px 0 0">${esc(a.issue.text)}</div>` : ""}${extra}</div></div>`;
}
function needsApproval(a) {
  let h = card(a, "needs", `<div class="lbl red">Needs approval by ${esc(dt(a.reply_by))}</div>`, actBtns(a));
  const b = ads.find(x => x.ad_id === a.backup_id);
  if (b) { const ub = form(a, "use_backup"); h += card(b, "backup", `<div class="lbl">Backup: posts instead if not approved by ${esc(dt(a.reply_by))}</div>`, ub ? `<div class="acts"><a class="btn" href="${esc(ub)}" target="_blank" rel="noopener">Use backup instead</a></div>` : ""); }
  return h;
}

/* status pills + banners */
function apPill() {
  const ap = D.autopilot || {}; const p = Object.values(ap.platforms || {});
  if (!ap.master || (p.length && p.every(v => !v))) return '<span class="pill red">Autopilot: OFF</span>';
  if (p.length && p.some(v => !v)) return `<span class="pill yellow">Autopilot: PARTIAL · on for ${p.filter(Boolean).length} of ${p.length}</span>`;
  return '<span class="pill green">Autopilot: ON</span>';
}
$("pills").innerHTML = (D.test_mode ? '<span class="pill orange">TEST MODE</span>' : '<span class="pill green">LIVE</span>') + apPill()
  + (D.autopilot && (D.autopilot.master === false || Object.values(D.autopilot.platforms || {}).some(v => !v)) && !(D.notices || []).some(n => n.sub) ? `<span class="small muted"><i>Want them back on? Reach out to the Vinedentity team using the contact options at the bottom of this page.</i></span>` : "");
const waiting = ads.filter(a => a.status === "awaiting").sort((a, b) => new Date(a.go_out) - new Date(b.go_out));
$("banner").innerHTML = waiting.length
  ? `<div class="banner red"><b>${waiting.length} ad${waiting.length > 1 ? "s" : ""} need${waiting.length > 1 ? "" : "s"} your approval</b><button class="btn" id="rv">Review &amp; approve</button></div>`
  : '<div class="banner green">All caught up. Everything\'s approved.</div>';
$("notices").innerHTML = (D.notices || []).map(n => `<div class="banner ${esc(n.level || "orange")}"><div>${esc(n.text)}${n.sub ? `<div class="small"><i>${esc(n.sub)}</i></div>` : ""}</div></div>`).join("");

/* footer help */
const h = D.support || {};
const sup = u => `${u}${u.includes("?") ? "&" : "?"}business=${encodeURIComponent(D.business_name || "")}&page=${encodeURIComponent((D.business_name || "") + " VineBUZZ")}&sub=${encodeURIComponent(D.sub_account_id || "")}`;
$("help").innerHTML = `${h.phone ? `<div>Need help? Text or call <a href="tel:${esc(h.phone.replace(/[^0-9+]/g, ""))}">${esc(h.phone)}</a></div>` : ""}${h.form_url ? `<a href="${esc(sup(h.form_url))}" target="_blank" rel="noopener">Need help? Send us a message</a>` : ""}${h.booking_url ? `<a href="${esc(h.booking_url)}" target="_blank" rel="noopener">Book a quick call</a>` : ""}`;

function vUpcoming() {
  const now = Date.now(); const days = RANGES.find(r => r[0] === range)[2];
  const end = range === "today" ? new Date(new Date().setHours(23, 59, 59, 999)).getTime() : now + days * 864e5;
  const isType = tab !== "all" && tab !== "today" && tab !== "awaiting";
  const lim = isType && ["Birthdays","Events"].includes(tab) ? Math.max(end, now + 30 * 864e5) : (tab === "today" ? new Date(new Date().setHours(23, 59, 59, 999)).getTime() : end);
  const list = ads.filter(a => a.go_out && !a.backup_for && ["scheduled","awaiting","approved"].includes(a.status) && new Date(a.go_out).getTime() >= now - 36e5 && new Date(a.go_out).getTime() <= lim && (!isType || a.type === tab))
    .sort((a, b) => new Date(a.go_out) - new Date(b.go_out));
  $("ctrl").innerHTML = tab === "today" ? "" : `<div class="seg" style="margin-bottom:12px">${RANGES.map(r => `<button class="${r[0] === range ? "on" : ""}" data-range="${r[0]}">${r[1]}</button>`).join("")}</div>`;
  return list.length ? list.map(a => a.status === "awaiting" ? needsApproval(a) : card(a)).join("") : '<div class="empty">No posts in this range.</div>';
}
function vAwaiting() { $("ctrl").innerHTML = ""; return waiting.length ? waiting.map(needsApproval).join("") : '<div class="empty">Nothing needs your approval right now.</div>'; }
function mmss(n) { n = Math.round(n); return `${Math.floor(n / 60)}:${String(n % 60).padStart(2, "0")}`; }
function score(a) { const p = a.performance || {}; return (p.reactions || 0) + (p.comments || 0) + (p.shares || 0); }
function vPrevious() {
  const days = PREV.find(r => r[0] === prange)[2]; const from = Date.now() - days * 864e5;
  const list = ads.filter(a => a.go_out && ["posted","not_ran","test_not_posted"].includes(a.status) && new Date(a.go_out).getTime() >= from && new Date(a.go_out).getTime() <= Date.now());
  const repl = new Set(list.map(a => a.replaced_with).filter(Boolean));
  for (let i = list.length - 1; i >= 0; i--) if (repl.has(list[i].ad_id)) list.splice(i, 1);
  const hasPerf = list.some(a => a.performance); const sort = hasPerf ? psort : "newest";
  list.sort(sort === "top" ? (a, b) => score(b) - score(a) : (a, b) => new Date(b.go_out) - new Date(a.go_out));
  $("ctrl").innerHTML = `<div class="row" style="margin-bottom:12px"><div class="seg">${PREV.map(r => `<button class="${r[0] === prange ? "on" : ""}" data-prange="${r[0]}">${r[1]}</button>`).join("")}</div>
    <div class="seg"><button class="${sort === "top" ? "on" : ""}" data-psort="top" ${hasPerf ? "" : "disabled"}>Top performing</button><button class="${sort === "newest" ? "on" : ""}" data-psort="newest">Newest first</button></div>${hasPerf ? "" : '<span class="small muted">Performance data unavailable</span>'}</div>`;
  if (!list.length) return '<div class="empty">No posts in this range yet.</div>';
  let month = "";
  return list.map(a => {
    let out = "";
    if (sort === "newest") { const m = new Date(a.go_out).toLocaleString([], { month: "long", year: "numeric" }); if (m !== month) { month = m; out += `<h3>${esc(m)}</h3>`; } }
    const p = a.performance;
    const perf = p ? `<div class="small muted" style="margin-top:6px">👍 ${p.reactions ?? 0} reactions · 💬 ${p.comments ?? 0} · ↗ ${p.shares ?? 0}${p.reach != null ? ` · 👁 ${p.reach} reach` : ""}${p.views != null ? ` · ▶ ${p.views} views` : ""}${p.avg_watch_sec != null ? ` · ⏱ avg watch ${mmss(p.avg_watch_sec)}` : ""}${p.nonfollower_reach != null ? ` · 🆕 ${p.nonfollower_reach} new people reached` : ""}</div>` : "";
    if (a.status !== "posted") {
      const why = a.status === "test_not_posted" ? "Did not post. Reason: Test mode." : a.not_ran_reason === "technical" ? "Did not run: technical issue" : a.not_ran_reason === "time_passed" ? "Did not run: time passed" : "NOT RAN - Not approved on time";
      out += card(a, "notran", `<div class="lbl red">${esc(why)}</div>`, a.rerun_label && form(a, "rerun") ? `<div class="acts"><a class="btn" href="${esc(form(a, "rerun"))}" target="_blank" rel="noopener">${esc(a.rerun_label)}</a></div>` : a.date_passed ? '<div class="reply">This date has passed</div>' : "");
      const b = ads.find(x => x.ad_id === a.replaced_with); if (b) out += card(b, "", '<div class="lbl">Ran in its place</div>', b.performance ? `<div class="small muted" style="margin-top:6px">👍 ${b.performance.reactions ?? 0} · 💬 ${b.performance.comments ?? 0} · ↗ ${b.performance.shares ?? 0}</div>` : "");
      return out;
    }
    return out + card(a, "", "", perf);
  }).join("");
}
function render() {
  const types = [...new Set(ads.filter(a => a.go_out && !a.backup_for && ["scheduled","awaiting","approved"].includes(a.status)).map(a => a.type).filter(Boolean))].sort();
  const T = [["all","All"],["today","Today"],...types.map(t => [t, t]),["awaiting", `Awaiting Approval${waiting.length ? ` (${waiting.length})` : ""}`],["previous","Previous"]];
  $("tabs").innerHTML = T.map(([k, l]) => `<button class="${k === tab ? "on" : ""}" data-tab="${esc(k)}">${esc(l)}</button>`).join("");
  $("view").innerHTML = tab === "previous" ? vPrevious() : tab === "awaiting" ? vAwaiting() : vUpcoming();
}
document.addEventListener("click", e => {
  if (e.target.id === "rv") { tab = "awaiting"; render(); return; }
  const t = e.target.closest("[data-tab],[data-range],[data-prange],[data-psort]"); if (!t) return;
  if (t.dataset.tab) tab = t.dataset.tab; if (t.dataset.range) range = t.dataset.range; if (t.dataset.prange) prange = t.dataset.prange; if (t.dataset.psort) psort = t.dataset.psort;
  render();
});
render();
})();
</script>
</body>
</html>
